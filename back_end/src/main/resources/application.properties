spring.application.name=smartbanking
spring.config.import=optional:classpath:application-local.properties

# Local config (override in application-local.properties or env)
server.port=${SERVER_PORT:8081}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Không để mật khẩu thật trong file này: đặt biến môi trường hoặc ghi vào application-local.properties
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OTP
app.otp.expiration-seconds=300
# Trả mã OTP trong response để test. Mặc định TẮT; chỉ bật ở application-local.properties khi dev.
app.otp.expose-in-response=${APP_OTP_EXPOSE:false}

# JWT: bắt buộc cấu hình (biến môi trường JWT_SECRET hoặc application-local.properties), tối thiểu 32 ký tự
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.jwt.refresh-expiration-remember-ms=2592000000

app.fe.base-url=${APP_FE_BASE_URL:http://127.0.0.1:5500}

# Không ghi câu SQL và giá trị tham số (mật khẩu đã băm, số dư, số giấy tờ...) ra log.
# Cần debug thì bật trong application-local.properties.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ===== Swagger UI =====
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
