services:
  mysql:
    image: mysql:8.0
    container_name: smartbanking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartbanking}
      MYSQL_DATABASE: smart_banking
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbanking-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartbanking}
      JWT_SECRET: ${JWT_SECRET:?Hay dat JWT_SECRET trong file .env}
      APP_FE_BASE_URL: ${APP_FE_BASE_URL:-http://localhost:5500}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
